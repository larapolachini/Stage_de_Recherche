parameters:
    max_age: 1.5e3
    wait_for_min_nb_neighbors: 1
    initial_s_max_val: 1.0
    tau: 0.01
    tau_inc: 2.0e-3
    tau_max: 0.12
    diffusion_convergence_threshold: 0.1
    diffusion_min_nb_points: 3
    diffusion_min_abs_s: 0.e-05
    #min_s_val_to_update_led: 0.05
    min_s_val_to_update_led: 0.01

    age_initial_random_walk: 0
    age_random_walk_choice: 30
    age_randow_walk: 0
    age_handshake: 10
    age_diffusion: 100
    age_diffusion_it: 1
    age_diffusion_burnin: 10
    age_collective_avg_lambda: 10
    age_collective_avg_lambda_it: 1
    age_collective_final_lambda: 10
    age_collective_final_lambda_it: 1
    age_start_it_waiting_time: 1

